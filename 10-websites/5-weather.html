<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherNow - Your Weather Forecast</title>
    <link rel="stylesheet" href="shared/theme.css">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .search-container {
            max-width: 600px;
            margin: 0 auto 3rem;
        }

        .search-box {
            display: flex;
            gap: 1rem;
        }

        .search-input {
            flex: 1;
            padding: 1rem;
            border: none;
            border-radius: 25px;
            font-size: 1.1rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .search-btn {
            background: white;
            color: #4facfe;
            border: none;
            padding: 1rem 2rem;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .current-weather {
            background: white;
            border-radius: 20px;
            padding: 3rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }

        .location {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #333;
        }

        .current-temp {
            font-size: 5rem;
            font-weight: bold;
            color: #4facfe;
        }

        .weather-icon {
            font-size: 8rem;
            margin: 1rem 0;
        }

        .weather-description {
            font-size: 1.5rem;
            color: #666;
            margin-bottom: 2rem;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .detail-item {
            text-align: center;
        }

        .detail-label {
            color: #888;
            margin-bottom: 0.5rem;
        }

        .detail-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
        }

        .forecast {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .forecast-card {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .forecast-card:hover {
            transform: translateY(-5px);
        }

        .forecast-day {
            font-weight: bold;
            margin-bottom: 1rem;
            color: #333;
        }

        .forecast-icon {
            font-size: 3rem;
            margin: 1rem 0;
        }

        .forecast-temp {
            font-size: 1.5rem;
            font-weight: bold;
            color: #4facfe;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⛅ WeatherNow</h1>
            <p>Real-time weather updates for any location</p>
        </div>

        <div class="search-container">
            <div class="search-box">
                <input type="text" class="search-input" placeholder="Enter city name..." id="cityInput" value="San Francisco">
                <button class="search-btn" onclick="searchWeather()">Search</button>
            </div>
            <div id="statusMessage" style="color: white; text-align: center; margin-top: 0.75rem; min-height: 1.2rem; text-shadow: 1px 1px 3px rgba(0,0,0,0.3);"></div>
        </div>

        <div class="current-weather">
            <div class="location" id="location">San Francisco, CA</div>
            <div class="weather-icon" id="weatherIcon">☀️</div>
            <div class="current-temp" id="currentTemp">72°F</div>
            <div class="weather-description" id="description">Sunny</div>

            <div class="weather-details">
                <div class="detail-item">
                    <div class="detail-label">Feels Like</div>
                    <div class="detail-value" id="feelsLike">70°F</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Humidity</div>
                    <div class="detail-value" id="humidity">65%</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Wind Speed</div>
                    <div class="detail-value" id="windSpeed">12 mph</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Pressure</div>
                    <div class="detail-value" id="pressure">1013 hPa</div>
                </div>
            </div>
        </div>

        <h2 style="color: white; margin-bottom: 1.5rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.2);">7-Day Forecast</h2>
        <div class="forecast" id="forecast"></div>
    </div>

    <script src="shared/storage.js"></script>
    <script>
        const STORAGE_KEY = 'weathernow_last_city';

        const WEATHER_CODES = {
          0: { desc: 'Clear Sky', icon: '☀️' },
          1: { desc: 'Mostly Clear', icon: '🌤️' },
          2: { desc: 'Partly Cloudy', icon: '⛅' },
          3: { desc: 'Overcast', icon: '☁️' },
          45: { desc: 'Foggy', icon: '🌫️' },
          48: { desc: 'Foggy', icon: '🌫️' },
          51: { desc: 'Light Drizzle', icon: '🌦️' },
          53: { desc: 'Drizzle', icon: '🌦️' },
          55: { desc: 'Heavy Drizzle', icon: '🌧️' },
          61: { desc: 'Light Rain', icon: '🌧️' },
          63: { desc: 'Rain', icon: '🌧️' },
          65: { desc: 'Heavy Rain', icon: '🌧️' },
          71: { desc: 'Light Snow', icon: '🌨️' },
          73: { desc: 'Snow', icon: '❄️' },
          75: { desc: 'Heavy Snow', icon: '❄️' },
          77: { desc: 'Snow Grains', icon: '❄️' },
          80: { desc: 'Rain Showers', icon: '🌦️' },
          81: { desc: 'Rain Showers', icon: '🌧️' },
          82: { desc: 'Violent Showers', icon: '⛈️' },
          85: { desc: 'Snow Showers', icon: '🌨️' },
          86: { desc: 'Snow Showers', icon: '❄️' },
          95: { desc: 'Thunderstorm', icon: '⛈️' },
          96: { desc: 'Thunderstorm', icon: '⛈️' },
          99: { desc: 'Severe Thunderstorm', icon: '⛈️' }
        };

        function weatherFor(code) {
          return WEATHER_CODES[code] || { desc: 'Unknown', icon: '🌡️' };
        }

        function setStatus(message, isError) {
          const el = document.getElementById('statusMessage');
          el.textContent = message || '';
          el.style.color = isError ? '#ffe0e0' : 'white';
        }

        function dayLabel(isoDate, index) {
          if (index === 0) { return 'Today'; }
          const d = new Date(isoDate + 'T00:00:00');
          return d.toLocaleDateString('en-US', { weekday: 'short' });
        }

        async function geocodeCity(city) {
          const url = 'https://geocoding-api.open-meteo.com/v1/search?name=' + encodeURIComponent(city) + '&count=1&language=en&format=json';
          const res = await fetch(url);
          if (!res.ok) { throw new Error('Location lookup failed'); }
          const data = await res.json();
          if (!data.results || data.results.length === 0) { throw new Error('City not found'); }
          return data.results[0];
        }

        async function fetchWeather(lat, lon) {
          const url = 'https://api.open-meteo.com/v1/forecast'
                + '?latitude=' + lat + '&longitude=' + lon
                + '&current=temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m,surface_pressure,weather_code'
                + '&daily=weather_code,temperature_2m_max,temperature_2m_min'
                + '&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto';
          const res = await fetch(url);
          if (!res.ok) { throw new Error('Forecast lookup failed'); }
          return res.json();
        }

        function renderWeather(place, data) {
          const current = data.current;
          const currentWeather = weatherFor(current.weather_code);

          document.getElementById('location').textContent = place.name + (place.country ? ', ' + (place.admin1 || place.country) : '');
          document.getElementById('weatherIcon').textContent = currentWeather.icon;
          document.getElementById('currentTemp').textContent = Math.round(current.temperature_2m) + '°F';
          document.getElementById('description').textContent = currentWeather.desc;
          document.getElementById('feelsLike').textContent = Math.round(current.apparent_temperature) + '°F';
          document.getElementById('humidity').textContent = Math.round(current.relative_humidity_2m) + '%';
          document.getElementById('windSpeed').textContent = Math.round(current.wind_speed_10m) + ' mph';
          document.getElementById('pressure').textContent = Math.round(current.surface_pressure) + ' hPa';

          const daily = data.daily;
          const forecastHTML = daily.time.map(function (isoDate, i) {
            const code = daily.weather_code[i];
            const w = weatherFor(code);
            const high = Math.round(daily.temperature_2m_max[i]);
            return '<div class="forecast-card">'
                    + '<div class="forecast-day">' + dayLabel(isoDate, i) + '</div>'
                    + '<div class="forecast-icon">' + w.icon + '</div>'
                    + '<div class="forecast-temp">' + high + '°F</div>'
                    + '</div>';
          }).join('');

          document.getElementById('forecast').innerHTML = forecastHTML;
        }

        async function searchWeather() {
          const cityInput = document.getElementById('cityInput');
          const city = cityInput.value.trim();
          if (!city) { return; }

          setStatus('Looking up ' + city + '...', false);

          try {
            const place = await geocodeCity(city);
            const data = await fetchWeather(place.latitude, place.longitude);
            renderWeather(place, data);
            setStatus('', false);
            setJSON(STORAGE_KEY, city);
          } catch (err) {
            console.error(err);
            setStatus('Couldn\'t find weather for "' + city + '". Try another city name.', true);
          }
        }

        (function init() {
          const startingCity = getJSON(STORAGE_KEY, 'San Francisco');
          document.getElementById('cityInput').value = startingCity;
          searchWeather();
        })();
    </script>
</body>
</html>
