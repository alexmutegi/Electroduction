<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicStream - Your Music Library</title>
    <link rel="stylesheet" href="shared/theme.css">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: #121212;
            color: white;
        }

        .player-container {
            display: grid;
            grid-template-columns: 250px 1fr;
            height: 100vh;
        }

        .sidebar {
            background: #000;
            padding: 2rem 1rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 2rem;
            color: #1db954;
        }

        .menu {
            list-style: none;
        }

        .menu-item {
            padding: 1rem;
            margin-bottom: 0.5rem;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .menu-item:hover {
            background: #282828;
        }

        .main-content {
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(180deg, #1db954 0%, #121212 100%);
            padding: 2rem;
        }

        .header h1 {
            font-size: 3rem;
        }

        .content {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .songs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .song-card {
            background: #181818;
            border-radius: 10px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .song-card:hover {
            background: #282828;
            transform: scale(1.05);
        }

        .song-cover {
            width: 100%;
            aspect-ratio: 1;
            background: linear-gradient(135deg, #1db954, #1ed760);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .song-title {
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .song-artist {
            color: #b3b3b3;
            font-size: 0.9rem;
        }

        .player {
            background: #181818;
            padding: 1.5rem;
            display: flex;
            align-items: center;
            gap: 2rem;
            border-top: 1px solid #282828;
        }

        .now-playing {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex: 1;
        }

        .current-cover {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #1db954, #1ed760);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }

        .controls {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .control-buttons {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .control-btn {
            background: none;
            border: none;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            transition: color 0.3s;
        }

        .control-btn:hover {
            color: #1db954;
        }

        .play-btn {
            background: white;
            color: #000;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .progress-bar {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .progress {
            flex: 1;
            height: 6px;
            background: #404040;
            border-radius: 3px;
            cursor: pointer;
        }

        .progress-fill {
            height: 100%;
            background: #1db954;
            border-radius: 3px;
            width: 30%;
        }

        .time {
            font-size: 0.8rem;
            color: #b3b3b3;
        }

        .volume {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 1rem;
            justify-content: flex-end;
        }
    </style>
</head>
<body>
    <div class="player-container">
        <div class="sidebar">
            <div class="logo">🎵 MusicStream</div>
            <ul class="menu">
                <li class="menu-item">🏠 Home</li>
                <li class="menu-item">🔍 Search</li>
                <li class="menu-item">📚 Your Library</li>
                <li class="menu-item">➕ Create Playlist</li>
                <li class="menu-item">❤️ Liked Songs</li>
            </ul>
        </div>

        <div class="main-content">
            <div class="header">
                <h1>Good Evening</h1>
            </div>

            <div class="content">
                <h2 class="section-title">Popular This Week</h2>
                <div class="songs-grid" id="songsGrid"></div>

                <h2 class="section-title">Recently Played</h2>
                <div class="songs-grid" id="recentGrid"></div>

                <h2 class="section-title">💚 Liked Songs</h2>
                <div class="songs-grid" id="likedGrid"></div>
            </div>

            <div class="player">
                <div class="now-playing">
                    <div class="current-cover" id="currentCover">🎵</div>
                    <div>
                        <div class="song-title" id="currentTitle">Select a song</div>
                        <div class="song-artist" id="currentArtist">Artist</div>
                    </div>
                    <button class="control-btn" id="likeBtn" onclick="toggleLikeCurrent()" title="Like this song">🤍</button>
                </div>

                <div class="controls">
                    <div class="control-buttons">
                        <button class="control-btn">🔀</button>
                        <button class="control-btn">⏮️</button>
                        <button class="control-btn play-btn" id="playBtn" onclick="togglePlay()">▶️</button>
                        <button class="control-btn">⏭️</button>
                        <button class="control-btn">🔁</button>
                    </div>
                    <div class="progress-bar">
                        <span class="time">0:00</span>
                        <div class="progress">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <span class="time">3:45</span>
                    </div>
                </div>

                <div class="volume">
                    <span>🔊</span>
                    <div class="progress" style="width: 100px;">
                        <div class="progress-fill" style="width: 70%;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="shared/storage.js"></script>
    <script>
        const songs = [
          { id: 1, title: 'Summer Vibes', artist: 'The Beach Boys', icon: '🏖️' },
          { id: 2, title: 'Midnight Jazz', artist: 'Miles Davis', icon: '🎷' },
          { id: 3, title: 'Electric Dreams', artist: 'Daft Punk', icon: '⚡' },
          { id: 4, title: 'Classical Sunrise', artist: 'Mozart', icon: '🌅' },
          { id: 5, title: 'Rock Anthem', artist: 'Queen', icon: '🎸' },
          { id: 6, title: 'Hip Hop Nation', artist: '2Pac', icon: '🎤' },
          { id: 7, title: 'Country Roads', artist: 'John Denver', icon: '🛣️' },
          { id: 8, title: 'Pop Sensation', artist: 'Taylor Swift', icon: '✨' }
        ];

        let isPlaying = false;
        let currentSong = null;
        const LIKED_KEY = 'musicstream_liked';

        function loadLiked() {
          return getJSON(LIKED_KEY, []);
        }

        function saveLiked(ids) {
          setJSON(LIKED_KEY, ids);
        }

        let likedSongs = loadLiked();

        function renderSongs(containerId, songList) {
          const container = document.getElementById(containerId);
          if (songList.length === 0) {
            container.innerHTML = '<p style="color: #888; padding: 1rem 0;">No liked songs yet. Tap the heart on a playing song to like it.</p>';
            return;
          }
          container.innerHTML = songList.map(song => `
                <div class="song-card" onclick="playSong(${song.id})">
                    <div class="song-cover">${likedSongs.includes(song.id) ? '💚 ' : ''}${song.icon}</div>
                    <div class="song-title">${song.title}</div>
                    <div class="song-artist">${song.artist}</div>
                </div>
            `).join('');
        }

        function renderLiked() {
          const likedSongObjects = songs.filter(s => likedSongs.includes(s.id));
          renderSongs('likedGrid', likedSongObjects);
        }

        function updateLikeButton() {
          const btn = document.getElementById('likeBtn');
          if (!btn || !currentSong) {return;}
          btn.textContent = likedSongs.includes(currentSong.id) ? '💚' : '🤍';
        }

        function toggleLikeCurrent() {
          if (!currentSong) {return;}
          const idx = likedSongs.indexOf(currentSong.id);
          if (idx === -1) {
            likedSongs.push(currentSong.id);
          } else {
            likedSongs.splice(idx, 1);
          }
          saveLiked(likedSongs);
          updateLikeButton();
          renderSongs('songsGrid', songs);
          renderSongs('recentGrid', songs.slice(0, 4));
          renderLiked();
        }

        function playSong(id) {
          currentSong = songs.find(s => s.id === id);
          document.getElementById('currentCover').textContent = currentSong.icon;
          document.getElementById('currentTitle').textContent = currentSong.title;
          document.getElementById('currentArtist').textContent = currentSong.artist;
          isPlaying = true;
          document.getElementById('playBtn').textContent = '⏸️';
          updateLikeButton();
        }

        function togglePlay() {
          isPlaying = !isPlaying;
          document.getElementById('playBtn').textContent = isPlaying ? '⏸️' : '▶️';
        }

        renderSongs('songsGrid', songs);
        renderSongs('recentGrid', songs.slice(0, 4));
        renderLiked();

        // Animate progress bar
        setInterval(() => {
          if (isPlaying) {
            const fill = document.getElementById('progressFill');
            const current = parseFloat(fill.style.width || '0');
            fill.style.width = ((current + 0.5) % 100) + '%';
          }
        }, 1000);
    </script>
</body>
</html>
